name: Build & Sign iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 已从 app.mobileprovision 解出：Aramco Services Company / Team 4TDEWHFV5T
  # 证书只签这个 Bundle ID，必须与描述文件一致
  BUNDLE_ID: com.arammo.cycomm
  APP_NAME: JukeboxPlayer

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # ① 编译出未签名的 .app（不校验签名，直接覆盖 Bundle ID）
      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project JukeboxPlayer.xcodeproj \
            -target JukeboxPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID

      # ② 把 Secrets 里的 base64 还原成文件
      - name: Decode cert & provisioning from secrets
        run: |
          echo "${{ secrets.CERT_P12 }}" | base64 --decode > cert.p12
          echo "${{ secrets.PROVISIONING }}" | base64 --decode > app.mobileprovision

      # ③ 安装 zsign（官方预编译 macOS arm64 二进制，免源码编译）
      - name: Build zsign
        run: |
          curl -L -o zsign.tar.gz https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-macos-arm64.tar.gz
          tar xzf zsign.tar.gz
          ZSIGN=$(find "$PWD" -type f -name zsign | head -1)
          echo "zsign binary: $ZSIGN"
          chmod +x "$ZSIGN"
          echo "$(dirname "$ZSIGN")" >> "$GITHUB_PATH"

      # ④ 用你的证书签名并打包成 ipa（-b 强制指定与描述文件匹配的 Bundle ID）
      - name: Sign & package ipa
        run: |
          APP=$(find build -name "JukeboxPlayer.app" -type d | head -1)
          echo "Building ipa from: $APP"
          zsign -f \
            -k cert.p12 \
            -p "${{ secrets.CERT_PASSWORD }}" \
            -m app.mobileprovision \
            -b "$BUNDLE_ID" \
            -o JukeboxPlayer.ipa \
            "$APP"

      # ⑤ 上传成品
      - name: Upload signed ipa
        uses: actions/upload-artifact@v4
        with:
          name: JukeboxPlayer-signed-ipa
          path: JukeboxPlayer.ipa
          if-no-files-found: error
