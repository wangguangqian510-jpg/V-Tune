name: Build & Sign iOS IPA (念念有账)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 描述文件绑定的 Bundle ID（与 V-Tune 同一证书，必须一致）
  BUNDLE_ID: com.aramco.cycomm
  APP_NAME: FreeGrid

jobs:
      BUNDLE_ID: com.moyuxuan.nianyue
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # ① 编译出未签名的 .app
      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project FreeGrid.xcodeproj \
            -target FreeGrid \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID

      # ② Secrets 还原证书与描述文件
      - name: Decode cert & provisioning from secrets
        run: |
          echo "${{ secrets.CERT_P12 }}" | base64 --decode > cert.p12
          echo "${{ secrets.PROVISIONING }}" | base64 --decode > app.mobileprovision

      # ③ 安装 zsign（官方预编译 macOS arm64）
      - name: Build zsign
        run: |
          curl -L -o zsign.tar.gz https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-macos-arm64.tar.gz
          tar xzf zsign.tar.gz
          ZSIGN=$(find "$PWD" -type f -name zsign | head -1)
          echo "zsign binary: $ZSIGN"
          chmod +x "$ZSIGN"
          echo "$(dirname "$ZSIGN")" >> "$GITHUB_PATH"

      # ④ 签名（FreeGrid 无自定义 entitlements，zsign -m 合并描述文件即可）
      - name: Sign .app in place
        run: |
          APP=$(find build -name "FreeGrid.app" -type d | head -1)
          echo "Signing app: $APP"
          zsign -f \
            -k cert.p12 \
            -p "${{ secrets.CERT_PASSWORD }}" \
            -m app.mobileprovision \
            -b "$BUNDLE_ID" \
            "$APP"

      # ⑤ 打包 IPA
      - name: Package ipa
        run: |
          APP=$(find build -name "FreeGrid.app" -type d | head -1)
          rm -rf Payload NianNianYouZhang.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y NianNianYouZhang.ipa Payload
          rm -rf Payload
          ls -la NianNianYouZhang.ipa
          echo "ipa size: $(stat -f%z NianNianYouZhang.ipa) bytes"

      # ⑥ 上传成品
      - name: Upload signed ipa
        uses: actions/upload-artifact@v4
        with:
          name: nianyue-signed-ipa
          path: NianNianYouZhang.ipa
          if-no-files-found: error
