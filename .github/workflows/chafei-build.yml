name: Build chafei IPA

# 只在 chafei/ 目录变更时触发，避免和仓库根目录的播放器构建互相干扰
on:
  push:
    branches: [ main ]
    paths: [ 'chafei/**' ]
  workflow_dispatch:

env:
  APP_NAME: Chafei
  # 若描述文件是通配符(*)，则使用独立 Bundle ID com.chafei.app；
  # 若是固定 ID(如 com.aramco.cycomm)，则只能沿用该 ID。具体由下方步骤自动判定。
  FALLBACK_BUNDLE_ID: com.aramco.cycomm

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: chafei
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Prebuild iOS native project (Expo -> Xcode)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Decode cert & provisioning from secrets
        run: |
          echo "${{ secrets.CERT_P12 }}" | base64 --decode > cert.p12
          echo "${{ secrets.PROVISIONING }}" | base64 --decode > app.mobileprovision

      - name: Determine bundle id from provisioning profile
        id: bid
        run: |
          python3 - <<'PY'
          import plistlib, os
          data = open('app.mobileprovision','rb').read()
          s = data.find(b'<?xml'); e = data.rfind(b'</plist>') + len(b'</plist>')
          pl = plistlib.loads(data[s:e])
          aid = pl['Entitlements']['application-identifier']
          print("Profile application-identifier:", aid)
          prefix, _, suffix = aid.partition('.')
          if suffix == '*':
              bid = 'com.chafei.app'
              print("Profile is WILDCARD -> using independent bundle id", bid)
          else:
              # 固定 ID：只能使用描述文件里那个，否则装不上
              bid = suffix
              print("Profile is FIXED -> can only use", bid)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("BUNDLE_ID=" + bid + "\n")
          PY

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -workspace ios/Chafei.xcworkspace \
            -scheme Chafei \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=${{ steps.bid.outputs.BUNDLE_ID }} \
            SYMROOT=$PWD/build \
            OBJROOT=$PWD/build/obj

      - name: Build zsign
        run: |
          curl -L -o zsign.tar.gz https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-macos-arm64.tar.gz
          tar xzf zsign.tar.gz
          ZSIGN=$(find "$PWD" -type f -name zsign | head -1)
          chmod +x "$ZSIGN"
          echo "$(dirname "$ZSIGN")" >> "$GITHUB_PATH"

      - name: Sign .app in place
        run: |
          APP=$(find build -name "Chafei.app" -type d | head -1)
          echo "Signing app: $APP"
          python3 ../merge_entitlements.py app.mobileprovision merged.entitlements
          zsign -f \
            -k cert.p12 \
            -p "${{ secrets.CERT_PASSWORD }}" \
            -m app.mobileprovision \
            -e merged.entitlements \
            -b "${{ steps.bid.outputs.BUNDLE_ID }}" \
            "$APP"

      - name: Package ipa
        run: |
          APP=$(find build -name "Chafei.app" -type d | head -1)
          rm -rf Payload Chafei.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y Chafei.ipa Payload
          rm -rf Payload
          ls -la Chafei.ipa
          echo "ipa size: $(stat -f%z Chafei.ipa) bytes"
          echo "bundle id used: ${{ steps.bid.outputs.BUNDLE_ID }}"
          echo "${{ steps.bid.outputs.BUNDLE_ID }}" > bundle_id.txt

      - name: Upload signed ipa
        uses: actions/upload-artifact@v4
        with:
          name: Chafei-signed-ipa
          path: chafei/Chafei.ipa
          if-no-files-found: error

      - name: Upload build meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chafei-build-meta
          path: chafei/bundle_id.txt
          if-no-files-found: ignore
